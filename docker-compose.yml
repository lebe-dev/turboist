services:
  turboist:
    image: tinyops/turboist:1.16.1
    ports:
      - "8080:8080"
    environment:
      BIND: "0.0.0.0:8080"
    env_file:
      - .env
    volumes:
      - ./config.yml:/app/config.yml:ro
      - ./data:/app/data
      # Association files for native passkeys; served under /.well-known/ when
      # WELL_KNOWN_PATH=/app/well-known is set (see deploy/well-known/README.md).
      - ./deploy/well-known:/app/well-known:ro
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1"
          # Required only for aragon hashing
          memory: 128M
