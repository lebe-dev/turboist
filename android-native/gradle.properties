# Gradle daemon sizing: the Android toolchain (AGP + KSP + the Compose compiler)
# needs noticeably more heap than a plain JVM build.
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
# Each module gets its own R class instead of one merged class holding every
# transitive dependency's ids. Keeps incremental builds cheap.
android.nonTransitiveRClass=true

kotlin.code.style=official
