// Everything the screens are drawn from is an immutable value: a record read out
// of the replica, or a domain type derived from one. None of it is ever mutated
// in place — a change produces a new object — so a row whose data has not changed
// is safe to leave as it is drawn.
//
// It has to be stated here rather than left to be worked out, because these
// classes are compiled without the Compose compiler: it cannot look inside a
// class it did not compile, so it assumes each one can change under it without
// saying so, and gives up the ability to skip anything drawn from one. What that
// costs is a list redrawing every visible row whenever anything in the workspace
// changes, which on a syncing device is constantly.
ru.tinyops.turboist.core.model.**

// The date and time types the screens are handed. Immutable by contract, and
// from a library that will never be compiled with the Compose compiler, so this
// is the only way the fact can be known.
java.time.*
