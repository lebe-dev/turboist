sonar.projectKey=turboist
sonar.projectName=Turboist
# sonar.projectVersion is passed at scan time from the VERSION file (see `just sonar-scan`).

sonar.sourceEncoding=UTF-8

# --- Sources ---
# Analyse the whole repo, minus vendored/generated/build artifacts and test code
# (test files are picked up separately via sonar.test.inclusions below).
sonar.sources=.
sonar.exclusions=\
  frontend/node_modules/**,\
  frontend/.svelte-kit/**,\
  frontend/build/**,\
  frontend/dist/**,\
  frontend/coverage/**,\
  frontend/src/lib/components/ui/**,\
  data/**,\
  coverage.html,\
  **/*_test.go,\
  **/testdata/**

sonar.coverage.exclusions=\
  frontend/src/lib/components/ui/**,\
  **/*_test.go,\
  **/testdata/**

# --- Tests ---
sonar.tests=.
sonar.test.inclusions=\
  **/*_test.go,\
  frontend/**/*.test.ts,\
  frontend/**/*.spec.ts

# --- Coverage (optional; generated by `just coverage` / vitest) ---
sonar.go.coverage.reportPaths=coverage.out
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
