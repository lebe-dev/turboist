openapi: 3.1.0
info:
  description: 'HTTP API of the Turboist task manager. Every failed request answers
    with an error envelope `{error: {code, message, details}}`.'
  title: Turboist API
  version: "1"
paths:
  /api/config:
    get:
      operationId: getApiConfig
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpapiPublicConfigResponse'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpapiErrorEnvelope'
          description: Error
      summary: Public client bootstrap config
      tags:
      - system
  /api/v1/api-tokens:
    get:
      description: Requires a session access token; API tokens are refused.
      operationId: getApiTokens
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/HandlersApiTokenResp'
                type: array
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpapiErrorEnvelope'
          description: Error
      security:
      - bearerAuth: []
      summary: List API tokens
      tags:
      - account
    post:
      description: Requires a session access token; API tokens are refused.
      operationId: postApiTokens
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HandlersApiTokenCreateReq'
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HandlersApiTokenCreateResp'
          description: Created
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpapiErrorEnvelope'
          description: Error
      security:
      - bearerAuth: []
      summary: Issue an API token
      tags:
      - account
  /api/v1/api-tokens/{id}:
    delete:
      description: Requires a session access token; API tokens are refused.
      operationId: deleteApiTokensId
      parameters:
      - in: path
        name: id
        required: true
        schema:
          format: int64
          type: integer
      responses:
        "204":
          description: No Content
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpapiErrorEnvelope'
          description: Error
      security:
      - bearerAuth: []
      summary: Revoke an API token
      tags:
      - account
  /api/v1/app-settings:
    get:
      operationId: getAppSettings
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HandlersAppSettingsResp'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpapiErrorEnvelope'
          description: Error
      security:
      - bearerAuth:
        - settings:read
      summary: Installation settings
      tags:
      - settings
  /api/v1/app-settings/auto-labels:
    put:
      operationId: putAppSettingsAutoLabels
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HandlersAutoLabelsPutReq'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HandlersAppSettingsResp'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpapiErrorEnvelope'
          description: Error
      security:
      - bearerAuth:
        - settings:write
      summary: Replace auto-label rules
      tags:
      - settings
  /api/v1/app-settings/inbox-processing:
    put:
      operationId: putAppSettingsInboxProcessing
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HandlersInboxSettingsPutReq'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HandlersAppSettingsResp'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpapiErrorEnvelope'
          description: Error
      security:
      - bearerAuth:
        - settings:write
      summary: Update inbox processing settings
      tags:
      - settings
  /api/v1/app-settings/link-titles:
    put:
      operationId: putAppSettingsLinkTitles
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HandlersLinkTitlesPutReq'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HandlersAppSettingsResp'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpapiErrorEnvelope'
          description: Error
      security:
      - bearerAuth:
        - settings:write
      summary: Update link title settings
      tags:
      - settings
  /api/v1/app-settings/project-suggestions:
    put:
      operationId: putAppSettingsProjectSuggestions
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HandlersProjectSuggestionsPutReq'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HandlersAppSettingsResp'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpapiErrorEnvelope'
          description: Error
      security:
      - bearerAuth:
        - settings:write
      summary: Replace project suggestion rules
      tags:
      - settings
  /api/v1/backup:
    get:
      description: |-
        A gzip-encoded JSON file (Content-Encoding: gzip).

        Requires a session access token; API tokens are refused.
      operationId: getBackup
      parameters:
      - description: Include user settings in the export.
        in: query
        name: settings
        schema:
          description: Include user settings in the export.
          type: boolean
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HandlersBackupFile'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpapiErrorEnvelope'
          description: Error
      security:
      - bearerAuth: []
      summary: Export a backup
      tags:
      - account
  /api/v1/calendars:
    get:
      operationId: getCalendars
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HandlersCalendarListResp'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpapiErrorEnvelope'
          description: Error
      security:
      - bearerAuth:
        - calendars:read
      summary: Connected calendars
      tags:
      - calendars
  /api/v1/calendars/accounts/{id}:
    delete:
      description: Requires a session access token; API tokens are refused.
      operationId: deleteCalendarsAccountsId
      parameters:
      - in: path
        name: id
        required: true
        schema:
          format: int64
          type: integer
      responses:
        "204":
          description: No Content
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpapiErrorEnvelope'
          description: Error
      security:
      - bearerAuth: []
      summary: Disconnect a calendar account
      tags:
      - calendars
  /api/v1/calendars/events:
    get:
      operationId: getCalendarsEvents
      parameters:
      - in: query
        name: start
        required: true
        schema:
          format: date-time
          type: string
      - in: query
        name: end
        required: true
        schema:
          format: date-time
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HandlersCalendarEventsResp'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpapiErrorEnvelope'
          description: Error
      security:
      - bearerAuth:
        - calendars:read
      summary: Calendar events in a range
      tags:
      - calendars
  /api/v1/calendars/google/callback:
    get:
      description: Redirects the browser back to the settings page.
      operationId: getCalendarsGoogleCallback
      parameters:
      - in: query
        name: state
        schema:
          type: string
      - in: query
        name: code
        schema:
          type: string
      - in: query
        name: error
        schema:
          type: string
      responses:
        "302":
          description: Found
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpapiErrorEnvelope'
          description: Error
      summary: Google OAuth redirect target
      tags:
      - calendars
  /api/v1/calendars/google/config:
    delete:
      description: Requires a session access token; API tokens are refused.
      operationId: deleteCalendarsGoogleConfig
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HandlersCalendarListResp'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpapiErrorEnvelope'
          description: Error
      security:
      - bearerAuth: []
      summary: Remove Google OAuth credentials and disconnect
      tags:
      - calendars
    patch:
      description: Requires a session access token; API tokens are refused.
      operationId: patchCalendarsGoogleConfig
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HandlersGoogleCalendarConfigPatchReq'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HandlersCalendarListResp'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpapiErrorEnvelope'
          description: Error
      security:
      - bearerAuth: []
      summary: Set Google OAuth credentials
      tags:
      - calendars
  /api/v1/calendars/google/start:
    get:
      operationId: getCalendarsGoogleStart
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HandlersGoogleStartResp'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpapiErrorEnvelope'
          description: Error
      security:
      - bearerAuth:
        - calendars:read
      summary: Start connecting Google Calendar
      tags:
      - calendars
  /api/v1/calendars/google/sync:
    post:
      description: Requires a session access token; API tokens are refused.
      operationId: postCalendarsGoogleSync
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HandlersCalendarListResp'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpapiErrorEnvelope'
          description: Error
      security:
      - bearerAuth: []
      summary: Refresh the list of Google calendars
      tags:
      - calendars
  /api/v1/calendars/settings:
    patch:
      description: Requires a session access token; API tokens are refused.
      operationId: patchCalendarsSettings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HandlersCalendarSettingsPatchReq'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HandlersCalendarListResp'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpapiErrorEnvelope'
          description: Error
      security:
      - bearerAuth: []
      summary: Update calendar settings
      tags:
      - calendars
  /api/v1/calendars/sources/{id}:
    patch:
      description: Requires a session access token; API tokens are refused.
      operationId: patchCalendarsSourcesId
      parameters:
      - in: path
        name: id
        required: true
        schema:
          format: int64
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HandlersCalendarSourcePatchReq'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HandlersCalendarSourceResp'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpapiErrorEnvelope'
          description: Error
      security:
      - bearerAuth: []
      summary: Select or deselect a calendar
      tags:
      - calendars
  /api/v1/config:
    get:
      description: Answers 304 when If-None-Match carries the current ETag.
      operationId: getConfig
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HandlersConfigResp'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpapiErrorEnvelope'
          description: Error
      security:
      - bearerAuth:
        - settings:read
        - tasks:read
        - projects:read
        - labels:read
        - contexts:read
        - troiki:read
        - templates:read
      summary: Everything the client shell needs at start
      tags:
      - system
  /api/v1/contexts:
    get:
      operationId: getContexts
      parameters:
      - description: Page size; defaults to 50, capped at 200.
        in: query
        name: limit
        schema:
          description: Page size; defaults to 50, capped at 200.
          type: integer
      - description: Number of items to skip.
        in: query
        name: offset
        schema:
          description: Number of items to skip.
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DtoPagedResponseContextDTO'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpapiErrorEnvelope'
          description: Error
      security:
      - bearerAuth:
        - contexts:read
      summary: List contexts
      tags:
      - contexts
    post:
      operationId: postContexts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DtoCreateContextRequest'
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DtoContextDTO'
          description: Created
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpapiErrorEnvelope'
          description: Error
      security:
      - bearerAuth:
        - contexts:write
      summary: Create a context
      tags:
      - contexts
  /api/v1/contexts/{id}:
    delete:
      operationId: deleteContextsId
      parameters:
      - in: path
        name: id
        required: true
        schema:
          format: int64
          type: integer
      responses:
        "204":
          description: No Content
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpapiErrorEnvelope'
          description: Error
      security:
      - bearerAuth:
        - contexts:write
      summary: Delete a context
      tags:
      - contexts
    get:
      operationId: getContextsId
      parameters:
      - in: path
        name: id
        required: true
        schema:
          format: int64
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DtoContextDTO'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpapiErrorEnvelope'
          description: Error
      security:
      - bearerAuth:
        - contexts:read
      summary: Get a context
      tags:
      - contexts
    patch:
      operationId: patchContextsId
      parameters:
      - in: path
        name: id
        required: true
        schema:
          format: int64
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DtoPatchContextRequest'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DtoContextDTO'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpapiErrorEnvelope'
          description: Error
      security:
      - bearerAuth:
        - contexts:write
      summary: Update a context
      tags:
      - contexts
  /api/v1/contexts/{id}/projects:
    get:
      operationId: getContextsIdProjects
      parameters:
      - in: path
        name: id
        required: true
        schema:
          format: int64
          type: integer
      - description: Page size; defaults to 50, capped at 200.
        in: query
        name: limit
        schema:
          description: Page size; defaults to 50, capped at 200.
          type: integer
      - description: Number of items to skip.
        in: query
        name: offset
        schema:
          description: Number of items to skip.
          type: integer
      - in: query
        name: status
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DtoPagedResponseProjectDTO'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpapiErrorEnvelope'
          description: Error
      security:
      - bearerAuth:
        - projects:read
      summary: List projects of a context
      tags:
      - contexts
    post:
      operationId: postContextsIdProjects
      parameters:
      - in: path
        name: id
        required: true
        schema:
          format: int64
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DtoCreateProjectRequest'
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DtoProjectDTO'
          description: Created
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpapiErrorEnvelope'
          description: Error
      security:
      - bearerAuth:
        - projects:write
      summary: Create a project in a context
      tags:
      - contexts
  /api/v1/contexts/{id}/tasks:
    get:
      operationId: getContextsIdTasks
      parameters:
      - in: path
        name: id
        required: true
        schema:
          format: int64
          type: integer
      - description: Page size; defaults to 50, capped at 200.
        in: query
        name: limit
        schema:
          description: Page size; defaults to 50, capped at 200.
          type: integer
      - description: Number of items to skip.
        in: query
        name: offset
        schema:
          description: Number of items to skip.
          type: integer
      - in: query
        name: status
        schema:
          enum:
          - open
          - completed
          - cancelled
          type: string
      - in: query
        name: priority
        schema:
          enum:
          - high
          - medium
          - low
          - no-priority
          type: string
      - in: query
        name: labelId
        schema:
          format: int64
          type: integer
      - description: Substring of the title.
        in: query
        name: q
        schema:
          description: Substring of the title.
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DtoPagedResponseTaskDTO'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpapiErrorEnvelope'
          description: Error
      security:
      - bearerAuth:
        - tasks:read
      summary: List tasks of a context
      tags:
      - contexts
    post:
      operationId: postContextsIdTasks
      parameters:
      - in: path
        name: id
        required: true
        schema:
          format: int64
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DtoCreateTaskRequest'
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DtoTaskDTO'
          description: Created
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpapiErrorEnvelope'
          description: Error
      security:
      - bearerAuth:
        - tasks:write
      summary: Create a task in a context
      tags:
      - contexts
  /api/v1/events:
    get:
      description: A text/event-stream; authenticated by the ticket query parameter
        rather than a header.
      operationId: getEvents
      parameters:
      - description: Single-use ticket from POST /api/v1/events/ticket.
        in: query
        name: ticket
        required: true
        schema:
          description: Single-use ticket from POST /api/v1/events/ticket.
          type: string
      responses:
        "200":
          content:
            text/event-stream:
              schema:
                type: string
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpapiErrorEnvelope'
          description: Error
      summary: Server-sent refetch hints
      tags:
      - events
  /api/v1/events/ticket:
    post:
      description: Requires a session access token; API tokens are refused.
      operationId: postEventsTicket
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HandlersTicketRequest'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HandlersTicketResponse'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpapiErrorEnvelope'
          description: Error
      security:
      - bearerAuth: []
      summary: Issue a single-use ticket for the event stream
      tags:
      - events
  /api/v1/harpoon:
    get:
      operationId: getHarpoon
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HandlersHarpoonResp'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpapiErrorEnvelope'
          description: Error
      security:
      - bearerAuth:
        - settings:read
      summary: Jump pair
      tags:
      - settings
  /api/v1/harpoon/attach:
    post:
      operationId: postHarpoonAttach
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HandlersHarpoonRefReq'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HandlersHarpoonResp'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpapiErrorEnvelope'
          description: Error
      security:
      - bearerAuth:
        - settings:write
      summary: Put an item into the jump pair
      tags:
      - settings
  /api/v1/harpoon/detach:
    post:
      operationId: postHarpoonDetach
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HandlersHarpoonRefReq'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HandlersHarpoonResp'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpapiErrorEnvelope'
          description: Error
      security:
      - bearerAuth:
        - settings:write
      summary: Remove an item from the jump pair
      tags:
      - settings
  /api/v1/inbox:
    get:
      operationId: getInbox
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HandlersInboxResponse'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpapiErrorEnvelope'
          description: Error
      security:
      - bearerAuth:
        - tasks:read
      summary: Inbox
      tags:
      - inbox
  /api/v1/inbox/processing:
    get:
      operationId: getInboxProcessing
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HandlersInboxProcessingStatusDTO'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpapiErrorEnvelope'
          description: Error
      security:
      - bearerAuth:
        - settings:read
      summary: Automatic inbox processing status
      tags:
